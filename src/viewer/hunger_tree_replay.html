<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hunger tree pilot</title>
<style>body{margin:24px;background:#172321;color:#edf0e7;font:15px system-ui}main{display:flex;gap:24px;flex-wrap:wrap}canvas{background:#e8e4ce;width:min(80vw,620px);height:auto}aside{max-width:540px}button,select,input{font:inherit;margin:5px;padding:5px}pre{background:#233a34;padding:16px;white-space:pre-wrap}#seek{width:320px}p{max-width:720px}label{white-space:nowrap}</style>
<h2>Hunger and decision-tree pilot</h2><p>Saved first lives, not live training. Coral = fixed predator; teal = prey; gold = food. Green bar = remaining hunger reserve. The tree chooses priorities and destinations; navigation is supplied.</p>
<select id="example"></select><button id="play">Play</button><button id="restart">Restart</button><select id="speed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select><label><input id="vision" type="checkbox">Vision</label><label><input id="target" type="checkbox" checked>Target</label><br>
<input id="seek" type="range" min="0" step="0.1"><span id="time"></span><main><section><canvas id="canvas" width="620" height="620"></canvas></section><aside><h3 id="status"></h3><p id="action"></p><pre id="tree"></pre></aside></main>
<script>
const data=/*PAYLOAD*/;
const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d');
for(const label of Object.keys(data.examples))$('example').add(new Option(label,label));
let t=0,playing=false,last=performance.now();
function current(){return data.examples[$('example').value]}
function setPlaying(value){playing=value;last=performance.now();$('play').textContent=playing?'Pause':'Play'}
function reset(){t=0;$('seek').max=current().frames.at(-1).seconds;$('tree').textContent=current().tree;draw()}
$('example').onchange=()=>{setPlaying(false);reset()};$('restart').onclick=()=>{reset();setPlaying(true)};
$('play').onclick=()=>{if(!playing&&t>=current().frames.at(-1).seconds)t=0;setPlaying(!playing)};
$('seek').oninput=()=>{t=+$('seek').value;draw()};
function draw(){const e=current(),frames=e.frames;let i=Math.min(Math.floor(t/.1+1e-8),frames.length-1);if(t>=frames.at(-1).seconds)i=frames.length-1;const f=frames[i],s=620/96;
ctx.fillStyle='#e8e4ce';ctx.fillRect(0,0,620,620);ctx.fillStyle='#6c7774';for(let y=0;y<96;y++)for(let x=0;x<96;x++)if(data.terrain.solid[y*96+x])ctx.fillRect(x*s,y*s,s+.3,s+.3);
ctx.fillStyle='#dfb52e';for(const [x,y] of f.pellets){ctx.beginPath();ctx.arc(x*s,y*s,4,0,7);ctx.fill()}
if($('target').checked){ctx.strokeStyle='#9656ac';ctx.beginPath();ctx.moveTo(f.prey[0]*s,f.prey[1]*s);ctx.lineTo(f.target[0]*s,f.target[1]*s);ctx.stroke()}
for(const [p,color,radius] of [[f.prey,'#239b9d',data.config.prey_vision],...(data.config.predator?[[f.predator,'#df755e',data.config.predator_vision]]:[])]){if($('vision').checked){ctx.strokeStyle=color;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(p[0]*s,p[1]*s,radius*s,0,7);ctx.stroke();ctx.setLineDash([])}ctx.fillStyle=color;ctx.beginPath();ctx.arc(p[0]*s,p[1]*s,2.4*s,0,7);ctx.fill()}
ctx.fillStyle='#172321';ctx.fillRect(12,12,190,25);ctx.fillStyle='#39b58d';ctx.fillRect(15,15,184*Math.max(0,f.hunger)/data.config.maximum_hunger,19);ctx.fillStyle='white';ctx.font='13px system-ui';ctx.fillText('Hunger '+f.hunger.toFixed(1),20,29);
$('time').textContent=t.toFixed(1)+' / '+frames.at(-1).seconds.toFixed(1)+'s';$('status').textContent=`Food ${f.food} | ${f.death||'alive'}`;$('action').textContent=f.action;$('seek').value=t}
function loop(now){if(playing){t=Math.min(current().frames.at(-1).seconds,t+(now-last)/1000*+$('speed').value);if(t>=current().frames.at(-1).seconds)setPlaying(false)}last=now;draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></html>
